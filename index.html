<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>InflowMap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ DESIGN TOKENS ============ */
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --font:"Hind Siliguri","Noto Sans Bengali","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  /* color: light */
  --bg:#F4F5F9; --surface:#FFFFFF; --surface-2:#EDEFF5; --border:#E1E4EC; --border-strong:#C3C9D8;
  --text:#14192B; --text-2:#4A5370; --text-3:#78809A;
  --primary:#34468A; --primary-contrast:#FFFFFF; --primary-soft:#E7EAF8;
  --accent:#D9962B; --accent-soft:#FBF0DC; --accent-ink:#85570A;
  --success:#3B8663; --success-soft:#E2F1EA; --danger:#B8433A; --danger-soft:#F8E6E4;
  --overlay:rgba(12,16,28,.45);
  /* type */
  --fs-title:28px; --fs-section:15px; --fs-body:16px; --fs-task:16px; --fs-sec:14px; --fs-meta:12.5px;
  /* space */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px;
  /* radii */
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:20px; --r-full:999px;
  /* elevation */
  --shadow-1:0 1px 2px rgba(20,25,43,.05);
  --shadow-sheet:0 -8px 32px rgba(12,16,28,.18);
  /* sizes */
  --btn-h:44px; --input-h:46px; --icon:22px; --nav-h:60px; --bar-h:112px; --tap:44px;
  /* motion */
  --dur-1:120ms; --dur-2:220ms; --dur-3:420ms; --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1017; --surface:#151923; --surface-2:#1D2230; --border:#262C3D; --border-strong:#3A4260;
    --text:#E8EBF4; --text-2:#A8B0C7; --text-3:#7C849C;
    --primary:#90A2F3; --primary-contrast:#0D1017; --primary-soft:#1C2345;
    --accent:#E7AF4D; --accent-soft:#33291A; --accent-ink:#F0C57A;
    --success:#5BB68D; --success-soft:#1A2E27; --danger:#E67D72; --danger-soft:#3A2220;
    --overlay:rgba(0,0,0,.6); --shadow-1:none; --shadow-sheet:0 -8px 32px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1017; --surface:#151923; --surface-2:#1D2230; --border:#262C3D; --border-strong:#3A4260;
  --text:#E8EBF4; --text-2:#A8B0C7; --text-3:#7C849C;
  --primary:#90A2F3; --primary-contrast:#0D1017; --primary-soft:#1C2345;
  --accent:#E7AF4D; --accent-soft:#33291A; --accent-ink:#F0C57A;
  --success:#5BB68D; --success-soft:#1A2E27; --danger:#E67D72; --danger-soft:#3A2220;
  --overlay:rgba(0,0,0,.6); --shadow-1:none; --shadow-sheet:0 -8px 32px rgba(0,0,0,.5);
}
:root[data-theme="light"]{color-scheme:light}

/* ============ BASE ============ */
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:var(--fs-body);line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.ic{display:block;flex:none}
#app{max-width:600px;margin:0 auto;padding:0 var(--s4) calc(var(--nav-h) + var(--s8) + env(safe-area-inset-bottom,0px))}
#view{outline:none}

/* ============ NAV ============ */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--text-3);font-size:12px;font-weight:500;min-height:var(--tap);transition:color var(--dur-1)}
.nav button[aria-current="page"]{color:var(--primary);font-weight:600}
@media (min-width:900px){
  .nav{top:0;right:auto;width:96px;border-top:0;border-right:1px solid var(--border);padding-top:env(safe-area-inset-top,0px)}
  .nav-in{display:flex;flex-direction:column;height:auto;padding-top:24px;gap:8px}
  .nav button{height:64px}
  #app{padding-bottom:var(--s8)}
}

/* ============ TYPOGRAPHY ============ */
.page-head{padding:var(--s6) 0 var(--s4)}
.greet{font-size:var(--fs-sec);color:var(--text-2)}
.title{font-size:var(--fs-title);line-height:1.25;font-weight:700;letter-spacing:-.01em;margin-top:2px}
.sub{font-size:var(--fs-sec);color:var(--text-3)}
.h2{font-size:var(--fs-section);font-weight:600;color:var(--text-2);margin:var(--s6) 0 var(--s2)}
.muted{color:var(--text-3);font-size:var(--fs-sec)}

/* ============ BUTTONS ============ */
.btn{height:var(--btn-h);padding:0 var(--s5);border-radius:var(--r-md);border:1px solid transparent;font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);transition:transform var(--dur-1),background var(--dur-1),opacity var(--dur-1)}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--primary);color:var(--primary-contrast)}
.btn-quiet{background:var(--surface-2);color:var(--text)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn.block{width:100%}
.icon-btn{width:var(--tap);height:var(--tap);border-radius:var(--r-md);border:0;background:none;display:grid;place-items:center;color:var(--text-2)}
.icon-btn:active{background:var(--surface-2)}
.chip-btn{height:40px;padding:0 12px;border-radius:var(--r-full);border:1px solid var(--border);background:var(--surface);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.chip-btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-contrast)}
.chip-btn:disabled{opacity:.55;cursor:not-allowed}
.chip-btn:active:not(:disabled){transform:scale(.97)}
.soon{font-size:11px;font-weight:500;color:var(--text-3)}
.tag{font-size:12px;font-weight:600;padding:1px 8px;border-radius:var(--r-full);background:var(--accent-soft);color:var(--accent-ink);white-space:nowrap}
.tag.mute{background:var(--surface-2);color:var(--text-2)}

/* ============ CARDS / HOME ============ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-1)}
.prog{padding:var(--s4) var(--s5)}
.prog-row{display:flex;align-items:baseline;gap:var(--s3)}
.pct{font-size:40px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.prog-text{font-size:15px;color:var(--text-2)}
.bar{height:6px;border-radius:3px;background:var(--surface-2);margin-top:var(--s3);overflow:hidden}
.bar span{display:block;height:100%;border-radius:3px;background:var(--primary);width:0;transition:width var(--dur-3) var(--ease),background var(--dur-2)}
.bar.full span{background:var(--success)}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin:var(--s4) 0 var(--s2)}
.notice{margin-top:var(--s3);padding:var(--s3) var(--s4);border-radius:var(--r-md);background:var(--accent-soft);color:var(--accent-ink);font-size:var(--fs-sec)}

.list-card{padding:var(--s1) var(--s4) var(--s2)}
.subj{padding:var(--s1) 0}
.subj+.subj{border-top:1px solid var(--border);margin-top:var(--s1)}
.subj-name{font-size:13px;font-weight:600;color:var(--text-2);margin:var(--s2) 0 0}
.task{display:flex;align-items:center;gap:2px;min-height:52px;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.chk{width:var(--tap);height:var(--tap);flex:none;display:grid;place-items:center;background:none;border:0;margin-left:-10px}
.chk i{width:22px;height:22px;border-radius:7px;border:2px solid var(--border-strong);display:grid;place-items:center;color:transparent;transition:background var(--dur-2),border-color var(--dur-2),color var(--dur-2),transform var(--dur-2) var(--ease)}
.chk:active i{transform:scale(.9)}
.task.done .chk i{background:var(--success);border-color:var(--success);color:#fff}
.task-main{flex:1;min-width:0;padding:var(--s2) 0;display:flex;flex-direction:column}
.task-title{font-size:var(--fs-task);font-weight:500;line-height:1.45;overflow-wrap:anywhere;transition:color var(--dur-2)}
.task.done .task-title{color:var(--text-3);text-decoration:line-through;text-decoration-color:var(--text-3)}
.task-meta{font-size:var(--fs-meta);color:var(--text-3);display:flex;gap:var(--s3);flex-wrap:wrap}
.kebab{width:var(--tap);height:var(--tap);flex:none;background:none;border:0;color:var(--text-3);display:grid;place-items:center;border-radius:var(--r-md);margin-right:-10px}
.kebab:active{background:var(--surface-2)}
.completed-head{display:flex;align-items:center;gap:var(--s2);width:100%;background:none;border:0;padding:var(--s4) 0 var(--s2);font-size:var(--fs-sec);font-weight:600;color:var(--text-2);min-height:var(--tap)}
.completed-head .ic{transition:transform var(--dur-2)}
.completed-head[aria-expanded="true"] .ic{transform:rotate(180deg)}
.empty{text-align:center;padding:72px var(--s4) var(--s6)}
.empty h2{font-size:22px;font-weight:700}
.empty p{color:var(--text-2);margin:var(--s2) 0 var(--s5)}

/* ============ ROUTINE ============ */
.rt-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding:var(--s2) 0 var(--s3)}
.rt-top{display:flex;align-items:center;gap:var(--s2);min-height:48px}
.rt-title{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:none;border:0;padding:0;text-align:left;font-size:22px;font-weight:700;letter-spacing:-.01em;min-height:var(--tap)}
.rt-title span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;background:var(--surface-2);border-radius:var(--r-md);padding:3px;gap:2px}
.seg button{flex:1;height:38px;border:0;background:none;border-radius:10px;font-size:14.5px;font-weight:600;color:var(--text-2);transition:background var(--dur-2),color var(--dur-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow-1)}
.trail{padding-top:var(--s2)}
.dayw{position:relative;padding:0 0 var(--s3) 28px;scroll-margin-top:calc(var(--bar-h) + 8px)}
.trail.cv .dayw{content-visibility:auto;contain-intrinsic-size:auto 170px}
.dayw::before{content:"";position:absolute;left:9px;top:0;bottom:0;width:2px;background:var(--border)}
.dayw:first-child::before{top:26px}
.dayw:last-child::before{bottom:auto;height:26px}
.dayw:only-child::before{display:none}
.node{position:absolute;left:3px;top:20px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--border-strong);transition:background var(--dur-2),border-color var(--dur-2)}
.dayw.is-complete .node{background:var(--success);border-color:var(--success)}
.dayw.is-today .node{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.day{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-1);overflow:hidden}
.day.today{border-color:var(--accent)}
.dayw.flash .day{animation:flash 1.4s var(--ease)}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--accent)}30%{box-shadow:0 0 0 4px var(--accent-soft)}100%{box-shadow:0 0 0 0 transparent}}
.day-head{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:52px;padding:var(--s2) var(--s4);background:none;border:0;text-align:left}
.day-title{font-size:15px;font-weight:700}
.day-date{font-size:13px;color:var(--text-3)}
.day-prog{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:13px;color:var(--text-2);font-variant-numeric:tabular-nums}
.day.complete .day-prog{color:var(--success);font-weight:600}
.day-head .chev{color:var(--text-3);transition:transform var(--dur-2) var(--ease)}
.day.open .day-head .chev{transform:rotate(180deg)}
.day-body{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows var(--dur-2) var(--ease),visibility 0s linear var(--dur-2)}
.day.open .day-body{grid-template-rows:1fr;visibility:visible;transition:grid-template-rows var(--dur-2) var(--ease),visibility 0s}
.day-clip{overflow:hidden;min-height:0}
.day-content{padding:0 var(--s4) var(--s1)}
.empty-day{font-size:var(--fs-sec);color:var(--text-3);padding:var(--s2) 0}
.add-inline{display:flex;align-items:center;gap:6px;width:calc(100% + 2*var(--s4));margin:var(--s1) calc(-1*var(--s4)) 0;padding:0 var(--s4);height:var(--tap);background:none;border:0;border-top:1px solid var(--border);color:var(--primary);font-size:14.5px;font-weight:600;text-align:left}
.fab-today{position:fixed;right:var(--s4);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + var(--s4));z-index:20;height:var(--btn-h);padding:0 var(--s5);border-radius:var(--r-full);border:0;background:var(--primary);color:var(--primary-contrast);font-weight:600;box-shadow:0 4px 16px rgba(12,16,28,.25);opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity var(--dur-2),transform var(--dur-2) var(--ease)}
.fab-today.show{opacity:1;transform:none;pointer-events:auto}
@media (min-width:900px){.fab-today{bottom:var(--s6)}}

/* ============ PROGRESS / MORE ============ */
.stat-list{padding:0 var(--s4)}
.stat{display:flex;justify-content:space-between;align-items:center;min-height:48px;border-top:1px solid var(--border);font-size:15px}
.stat:first-child{border-top:0}
.stat b{font-variant-numeric:tabular-nums}
.subj-row{padding:var(--s3) 0;border-top:1px solid var(--border)}
.subj-row:first-child{border-top:0}
.subj-row .top{display:flex;justify-content:space-between;gap:var(--s3);font-size:15px}
.subj-row .top b{font-variant-numeric:tabular-nums}
.subj-row .bar{margin-top:var(--s2)}
.subj-row small{color:var(--text-3);font-size:var(--fs-meta)}
.streak{display:flex;align-items:center;gap:var(--s3);padding:var(--s4) var(--s5)}
.streak .ic{color:var(--accent)}
.streak b{font-size:20px}
.miles{display:flex;gap:var(--s2);margin-top:var(--s2)}
.mile{font-size:12.5px;font-weight:600;padding:2px 10px;border-radius:var(--r-full);border:1px solid var(--border);color:var(--text-3)}
.mile.hit{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink)}
.group{padding:0 var(--s4)}
.row{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:56px;background:none;border:0;border-top:1px solid var(--border);text-align:left;padding:var(--s2) 0}
.row:first-child{border-top:0}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column}
.row-title{font-size:15.5px;font-weight:500;overflow-wrap:anywhere}
.row-sub{font-size:var(--fs-meta);color:var(--text-3)}
.row:disabled{opacity:.6;cursor:default}
.row.danger .row-title{color:var(--danger)}
.row-tags{display:flex;gap:6px;flex:none}
.inline-input{width:100%;height:var(--input-h);border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);padding:0 var(--s3);font-size:16px}

/* ============ SHEETS / FORMS ============ */
.overlay{position:fixed;inset:0;z-index:50;background:transparent;transition:background var(--dur-2)}
.overlay.open{background:var(--overlay)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--surface);border-radius:var(--r-xl) var(--r-xl) 0 0;box-shadow:var(--shadow-sheet);padding:var(--s2) var(--s4) calc(var(--s4) + env(safe-area-inset-bottom,0px));max-height:90dvh;overflow:auto;overscroll-behavior:contain;transform:translateY(100%);transition:transform 280ms var(--ease);outline:none}
.overlay.open .sheet{transform:none}
.grab{width:36px;height:4px;border-radius:2px;background:var(--border-strong);margin:4px auto var(--s3)}
.sh-title{font-size:19px;font-weight:700;margin-bottom:2px;overflow-wrap:anywhere}
.sh-sub{font-size:var(--fs-sec);color:var(--text-3);margin-bottom:var(--s3);overflow-wrap:anywhere}
.menu-item{display:flex;align-items:center;gap:var(--s3);width:100%;height:52px;background:none;border:0;border-top:1px solid var(--border);font-size:16px;font-weight:500;text-align:left}
.menu-item:first-of-type{border-top:0}
.menu-item .ic{color:var(--text-2)}
.menu-item.danger,.menu-item.danger .ic{color:var(--danger)}
.fld{display:block;margin-top:var(--s3)}
.fld>span{display:block;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.fld input,.fld textarea{width:100%;height:var(--input-h);border:1px solid var(--border-strong);border-radius:var(--r-md);background:var(--surface);padding:0 var(--s3);font-size:16px}
.fld textarea{height:auto;min-height:170px;padding:var(--s3);line-height:1.5;resize:vertical}
.fld input:focus,.fld textarea:focus,.inline-input:focus{outline:2px solid var(--primary);outline-offset:0;border-color:transparent}
.hint{display:block;font-size:var(--fs-meta);color:var(--text-3);margin-top:6px}
.err{font-size:var(--fs-sec);color:var(--danger);margin-top:var(--s3)}
.chips{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s2)}
.chip{height:36px;padding:0 12px;border-radius:var(--r-full);border:1px solid var(--border);background:var(--surface-2);font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.more{margin-top:var(--s3)}
.more summary{min-height:var(--tap);display:flex;align-items:center;font-size:14px;font-weight:600;color:var(--text-2);cursor:pointer}
.actions{display:flex;gap:var(--s2);margin-top:var(--s5)}
.actions .btn{flex:1}
.check{display:flex;align-items:center;gap:var(--s3);min-height:var(--tap);margin-top:var(--s2);font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--primary)}
.sheet .seg{margin-top:var(--s3)}
.jump-row{display:flex;gap:var(--s2);align-items:flex-end}
.jump-row .fld{flex:1;margin-top:var(--s3)}
.jump-row .btn{margin-bottom:0}
.code{width:100%;min-height:220px;border:1px solid var(--border-strong);border-radius:var(--r-md);background:var(--surface-2);padding:var(--s3);font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text)}

/* ============ TOAST ============ */
#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + var(--s3));transform:translate(-50%,12px);z-index:60;max-width:min(92vw,440px);display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);border-radius:var(--r-md);background:var(--text);color:var(--bg);font-size:14.5px;opacity:0;pointer-events:none;transition:opacity var(--dur-2),transform var(--dur-2) var(--ease)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:none;border:0;color:var(--accent);font-weight:700;padding:0 4px;min-height:32px}
:root[data-theme="dark"] #toast button{color:var(--primary-contrast)}
@media (min-width:900px){#toast{bottom:var(--s6)}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;scroll-behavior:auto!important}
}

/* ============ AI WORKSPACE REDESIGN ============ */
.ai-workspace{min-height:calc(100vh - 30px);display:flex;flex-direction:column;padding:10px 0 18px}
.ai-topbar{display:flex;align-items:center;gap:12px;padding:10px 0 16px;position:sticky;top:0;z-index:8;background:linear-gradient(var(--bg) 80%,transparent)}

<script>
'use strict';
/* =====================================================================
   InflowMap — Phase 1–3 (foundation, routine experience, progress)
   Layers: PURE (helpers/parser/validation) → DB (IndexedDB) → STORE
   (state + commands) → UI (views, sheets, events). AI layer comes later.
   ===================================================================== */

/* PURE:START */
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12, 0, 0); };
const todayISO = () => toISO(new Date());
const addDaysISO = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return toISO(d); };
const diffDays = (a, b) => Math.round((parseISO(a) - parseISO(b)) / 86400000);
const isValidISO = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && toISO(parseISO(s)) === s;
const fmtShort = s => parseISO(s).toLocaleDateString('en-GB', {day: 'numeric', month: 'short'});
const fmtLong = s => parseISO(s).toLocaleDateString('en-GB', {weekday: 'long', day: 'numeric', month: 'long'});
const bnDigits = s => String(s).replace(/[০-৯]/g, d => '০১২৩৪৫৬৭৮৯'.indexOf(d));
const toInt = v => { const n = parseInt(bnDigits(String(v == null ? '' : v).trim()), 10); return Number.isFinite(n) ? n : NaN; };
const clean = (s, max) => String(s == null ? '' : s).replace(/\s+/g, ' ').trim().slice(0, max);
const MAX_DAYS = 3650;

function parseBulk(text) {
  const days = new Map(); let cur = null; const warnings = []; let taskCount = 0; const subjects = new Set();
  String(text || '').split(/\r?\n/).forEach((raw, i) => {
    const line = raw.trim(); if (!line) return;
    const dm = bnDigits(line).match(/^(?:day|দিন)\s*[-#:]?\s*(\d{1,4})\s*[:.\-–]?\s*$/i);
    if (dm) {
      cur = parseInt(dm[1], 10);
      if (cur < 1 || cur > MAX_DAYS) { warnings.push(`Line ${i + 1}: day number is out of range.`); cur = null; return; }
      if (!days.has(cur)) days.set(cur, []);
      return;
    }
    const ci = line.search(/[:：]/);
    if (ci < 1) { warnings.push(`Line ${i + 1} was skipped.`); return; }
    if (cur === null) { warnings.push(`Line ${i + 1} comes before any "Day" line.`); return; }
    const subject = clean(line.slice(0, ci), 60);
    const titles = line.slice(ci + 1).split(/[,،;]/).map(s => clean(s, 200)).filter(Boolean);
    if (!subject || !titles.length) { warnings.push(`Line ${i + 1} was skipped.`); return; }
    subjects.add(subject.toLowerCase());
    titles.forEach(t => { days.get(cur).push({subject, title: t}); taskCount++; });
  });
  const nums = [...days.keys()];
  return {days, maxDay: nums.length ? Math.max(...nums) : 0, dayCount: nums.length, taskCount, subjectCount: subjects.size, warnings};
}

function validateTask(input, multi) {
  const subject = clean(input.subject, 60);
  if (!subject) return {error: 'Add a subject.'};
  const titles = multi
    ? String(input.title || '').split(/[,،;\n]/).map(s => clean(s, 200)).filter(Boolean)
    : [clean(input.title, 200)].filter(Boolean);
  if (!titles.length) return {error: 'Add a topic or task name.'};
  let minutes = null; const m = String(input.minutes == null ? '' : input.minutes).trim();
  if (m) { const n = toInt(m); if (!(n >= 1 && n <= 1440)) return {error: 'Estimated time should be between 1 and 1440 minutes.'}; minutes = n; }
  return {value: {subject, titles, minutes, note: clean(input.note, 300)}};
}
/* PURE:END */

/* ========================= DB (IndexedDB) ========================= */
const DB_NAME = 'inflowmap', DB_VER = 1;
const STORES = {
  routines: {}, days: {idx: ['routineId']}, subjects: {}, tasks: {idx: ['dayId']},
  notes: {}, sessions: {idx: ['taskId']}, templates: {}, aiChanges: {}, settings: {keyPath: 'key'}
};
const db = {
  h: null, ok: false,
  async open() {
    try {
      this.h = await new Promise((res, rej) => {
        const r = indexedDB.open(DB_NAME, DB_VER);
        r.onupgradeneeded = () => {
          const d = r.result;
          for (const [n, c] of Object.entries(STORES)) {
            if (d.objectStoreNames.contains(n)) continue;
            const s = d.createObjectStore(n, {keyPath: c.keyPath || 'id'});
            (c.idx || []).forEach(i => s.createIndex(i, i));
          }
        };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
        r.onblocked = () => rej(new Error('blocked'));
      });
      this.ok = true;
    } catch (e) { this.ok = false; }
    return this.ok;
  },
  getAll(name) {
    if (!this.ok) return Promise.resolve([]);
    return new Promise((res, rej) => {
      const r = this.h.transaction(name).objectStore(name).getAll();
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
  },
  batch(ch) {
    if (!this.ok) return Promise.resolve();
    const put = ch.put || {}, del = ch.del || {};
    const names = [...new Set([...Object.keys(put), ...Object.keys(del)])].filter(n => (put[n] && put[n].length) || (del[n] && del[n].length));
    if (!names.length) return Promise.resolve();
    return new Promise((res, rej) => {
      const tx = this.h.transaction(names, 'readwrite');
      for (const n of names) {
        const s = tx.objectStore(n);
        (put[n] || []).forEach(v => s.put(v));
        (del[n] || []).forEach(k => s.delete(k));
      }
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error || new Error('aborted'));
    });
  }
};

/* ============================ STORE ============================ */
const S = {routines: [], days: [], subjects: [], tasks: [], notes: [], sessions: [], templates: [], aiChanges: [], settings: {theme: 'system', name: ''}, v: 0};
const ui = {tab: 'home', routineView: 'all', viewRoutineId: null, dayOpen: {}, pendingCollapse: new Set(), showCompleted: false, lastPct: 0, scrollToday: false};

let _ix = null;
function index() {
  if (_ix && _ix.v === S.v) return _ix;
  const daysByRoutine = new Map(), dayById = new Map(), tasksByDay = new Map(), subjectById = new Map();
  S.subjects.forEach(s => subjectById.set(s.id, s));
  S.days.forEach(d => { dayById.set(d.id, d); if (!daysByRoutine.has(d.routineId)) daysByRoutine.set(d.routineId, []); daysByRoutine.get(d.routineId).push(d); });
  daysByRoutine.forEach(a => a.sort((x, y) => x.dayNumber - y.dayNumber));
  S.tasks.forEach(t => { if (!tasksByDay.has(t.dayId)) tasksByDay.set(t.dayId, []); tasksByDay.get(t.dayId).push(t); });
  tasksByDay.forEach(a => a.sort((x, y) => x.sortOrder - y.sortOrder));
  _ix = {v: S.v, daysByRoutine, dayById, tasksByDay, subjectById};
  return _ix;
}

function applyChanges(ch) {
  for (const [n, recs] of Object.entries(ch.put || {})) {
    const arr = S[n]; const pos = new Map(arr.map((x, i) => [x.id, i]));
    for (const r of recs) { if (pos.has(r.id)) arr[pos.get(r.id)] = r; else { pos.set(r.id, arr.length); arr.push(r); } }
  }
  for (const [n, ids] of Object.entries(ch.del || {})) { const set = new Set(ids); S[n] = S[n].filter(x => !set.has(x.id)); }
  S.v++;
}

async function commit(ch, opts) {
  opts = opts || {};
  ch.put = ch.put || {}; ch.del = ch.del || {};
  const touched = new Set(ch.touchDays || []);
  (ch.put.tasks || []).forEach(t => touched.add(t.dayId));
  applyChanges(ch);
  const ix = index(), fix = [];
  touched.forEach(did => {
    const d = ix.dayById.get(did); if (!d) return;
    const ts = ix.tasksByDay.get(did) || [];
    const st = ts.length && ts.every(t => t.completed) ? 'complete' : 'open';
    if (st !== d.status) {
      fix.push({...d, status: st});
      delete ui.dayOpen[did];
      if (st === 'complete') ui.pendingCollapse.add(did);
    }
  });
  if (fix.length) { applyChanges({put: {days: fix}}); ch.put.days = (ch.put.days || []).concat(fix); }
  if (opts.renderDelay) setTimeout(render, opts.renderDelay); else render();
  try { await db.batch(ch); }
  catch (e) { toast("Couldn't save that change. Reloading your data."); await loadAll(); render(); }
}

async function loadAll() {
  if (db.ok) {
    const [r, d, s, t, st, nt, se, tp, ac] = await Promise.all(['routines', 'days', 'subjects', 'tasks', 'settings', 'notes', 'sessions', 'templates', 'aiChanges'].map(n => db.getAll(n)));
    S.routines = r; S.days = d; S.subjects = s; S.tasks = t; S.notes = nt; S.sessions = se; S.templates = tp; S.aiChanges = ac;
    S.settings = {theme: 'system', name: '', ...Object.fromEntries(st.map(x => [x.key, x.value]))};
  }
  S.v++;
}
function setSetting(key, value) {
  S.settings[key] = value;
  db.batch({put: {settings: [{key, value}]}}).catch(() => toast("Couldn't save that setting."));
}

function subjectResolver(put) {
  const map = new Map(S.subjects.map(s => [s.name.toLowerCase(), s.id]));
  return name => {
    const k = name.toLowerCase();
    if (map.has(k)) return map.get(k);
    const s = {id: uid(), name}; (put.subjects = put.subjects || []).push(s); map.set(k, s.id); return s.id;
  };
}
function newTask(dayId, subjectId, title, sortOrder, x) {
  const now = Date.now(); x = x || {};
  return {id: uid(), dayId, subjectId, title, completed: false, completedAt: null,
    estimatedMinutes: x.minutes == null ? null : x.minutes, note: x.note || '', createdAt: now, updatedAt: now, sortOrder};
}
const nextOrder = dayId => (index().tasksByDay.get(dayId) || []).reduce((m, t) => Math.max(m, t.sortOrder), -1) + 1;
const findTask = id => S.tasks.find(t => t.id === id);
const primaryRoutine = () => S.routines.find(r => r.isPrimary) || null;
const currentRoutine = () => S.routines.find(r => r.id === ui.viewRoutineId) || primaryRoutine() || S.routines[0] || null;

function todayInfo(r) {
  const n = diffDays(todayISO(), r.startDate) + 1;
  const state = n < 1 ? 'before' : n > r.duration ? 'after' : 'during';
  const day = state === 'during' ? (index().daysByRoutine.get(r.id) || []).find(d => d.dayNumber === n) : null;
  return {n, state, day};
}
function statsFor(r) {
  const ix = index(), days = ix.daysByRoutine.get(r.id) || [];
  let total = 0, done = 0, daysDone = 0; const bySubj = new Map();
  days.forEach(d => {
    const ts = ix.tasksByDay.get(d.id) || []; total += ts.length; if (d.status === 'complete') daysDone++;
    ts.forEach(t => { if (t.completed) done++; const b = bySubj.get(t.subjectId) || {total: 0, done: 0}; b.total++; if (t.completed) b.done++; bySubj.set(t.subjectId, b); });
  });
  return {total, done, daysDone, days: days.length, bySubj, pct: total ? Math.round(done / total * 100) : 0};
}
function streakFor(r) {
  const ti = todayInfo(r); if (ti.state === 'before') return 0;
  const byNum = new Map((index().daysByRoutine.get(r.id) || []).map(d => [d.dayNumber, d]));
  let i = ti.state === 'after' ? r.duration : ti.n;
  if (!(byNum.get(i) && byNum.get(i).status === 'complete')) i--;
  let s = 0; while (i >= 1 && byNum.get(i) && byNum.get(i).status === 'complete') { s++; i--; }
  return s;
}
function subjectsInRoutine(rid) {
  const ix = index(), count = new Map();
  (ix.daysByRoutine.get(rid) || []).forEach(d => (ix.tasksByDay.get(d.id) || []).forEach(t => count.set(t.subjectId, (count.get(t.subjectId) || 0) + 1)));
  return [...count].sort((a, b) => b[1] - a[1]).map(([id]) => (ix.subjectById.get(id) || {}).name).filter(Boolean);
}
function groupBySubject(tasks) {
  const ix = index(), map = new Map();
  tasks.forEach(t => { if (!map.has(t.subjectId)) map.set(t.subjectId, []); map.get(t.subjectId).push(t); });
  return [...map].map(([sid, ts]) => ({name: (ix.subjectById.get(sid) || {}).name || 'Other', tasks: ts}));
}

/* ---- Commands: every mutation is validated here, never in the UI ---- */
const cmd = {
  async createRoutine({name, startDate, duration, items, makePrimary}) {
    name = clean(name, 60);
    if (!name) return {error: 'Give the routine a name.'};
    if (!isValidISO(startDate)) return {error: 'Choose a valid start date.'};
    if (!Number.isInteger(duration) || duration < 1 || duration > MAX_DAYS) return {error: `Duration should be between 1 and ${MAX_DAYS} days.`};
    const now = Date.now(), rid = uid(), put = {routines: [], days: [], subjects: [], tasks: []};
    const primary = makePrimary || !S.routines.some(r => r.isPrimary);
    if (primary) S.routines.filter(r => r.isPrimary).forEach(r => put.routines.push({...r, isPrimary: false, updatedAt: now}));
    put.routines.push({id: rid, name, startDate, duration, status: 'active', isPrimary: primary, createdAt: now, updatedAt: now});
    const subj = subjectResolver(put);
    for (let n = 1; n <= duration; n++) {
      const did = uid();
      put.days.push({id: did, routineId: rid, dayNumber: n, date: addDaysISO(startDate, n - 1), status: 'open'});
      ((items && items.get(n)) || []).forEach((it, i) => put.tasks.push(newTask(did, subj(it.subject), it.title, i, {minutes: it.minutes, note: it.note})));
    }
    await commit({put});
    return {id: rid};
  },
  async updateRoutine(id, {name, startDate, extend, status}) {
    const r = S.routines.find(x => x.id === id); if (!r) return {error: 'That routine no longer exists.'};
    const put = {routines: [], days: []}, now = Date.now(); const nr = {...r, updatedAt: now};
    if (name !== undefined) { nr.name = clean(name, 60); if (!nr.name) return {error: 'Give the routine a name.'}; }
    if (startDate !== undefined && startDate !== r.startDate) {
      if (!isValidISO(startDate)) return {error: 'Choose a valid start date.'};
      nr.startDate = startDate;
      (index().daysByRoutine.get(id) || []).forEach(d => put.days.push({...d, date: addDaysISO(startDate, d.dayNumber - 1)}));
    }
    if (extend) {
      if (!Number.isInteger(extend) || extend < 1 || r.duration + extend > MAX_DAYS) return {error: `A routine can have up to ${MAX_DAYS} days.`};
      for (let n = r.duration + 1; n <= r.duration + extend; n++) put.days.push({id: uid(), routineId: id, dayNumber: n, date: addDaysISO(nr.startDate, n - 1), status: 'open'});
      nr.duration = r.duration + extend;
    }
    if (status !== undefined) { if (!['active', 'paused', 'completed'].includes(status)) return {error: 'Unknown status.'}; nr.status = status; }
    put.routines.push(nr); await commit({put}); return {};
  },
  async setPrimary(id) {
    const now = Date.now();
    await commit({put: {routines: S.routines.filter(r => r.isPrimary !== (r.id === id)).map(r => ({...r, isPrimary: r.id === id, updatedAt: now}))}});
  },
  async deleteRoutine(id) {
    const ix = index(), days = ix.daysByRoutine.get(id) || [], del = {routines: [id], days: days.map(d => d.id), tasks: []};
    days.forEach(d => (ix.tasksByDay.get(d.id) || []).forEach(t => del.tasks.push(t.id)));
    const put = {};
    const wasPrimary = (S.routines.find(r => r.id === id) || {}).isPrimary;
    if (wasPrimary) { const next = S.routines.find(r => r.id !== id && r.status === 'active') || S.routines.find(r => r.id !== id); if (next) put.routines = [{...next, isPrimary: true, updatedAt: Date.now()}]; }
    if (ui.viewRoutineId === id) ui.viewRoutineId = null;
    await commit({put, del});
  },
  async addTasks(dayId, input) {
    const v = validateTask(input, true); if (v.error) return v;
    if (!index().dayById.has(dayId)) return {error: 'That day no longer exists.'};
    const put = {tasks: []}, sid = subjectResolver(put)(v.value.subject); let order = nextOrder(dayId);
    v.value.titles.forEach(title => put.tasks.push(newTask(dayId, sid, title, order++, {minutes: v.value.minutes, note: v.value.note})));
    await commit({put}); return {count: put.tasks.length};
  },
  async updateTask(id, input) {
    const t = findTask(id); if (!t) return {error: 'That task no longer exists.'};
    const v = validateTask(input, false); if (v.error) return v;
    const put = {tasks: []}; const sid = subjectResolver(put)(v.value.subject);
    put.tasks.push({...t, title: v.value.titles[0], subjectId: sid, estimatedMinutes: v.value.minutes, note: v.value.note, updatedAt: Date.now()});
    await commit({put}); return {};
  },
  async toggleTask(id, opts) {
    const t = findTask(id); if (!t) return;
    await commit({put: {tasks: [{...t, completed: !t.completed, completedAt: t.completed ? null : Date.now(), updatedAt: Date.now()}]}}, opts);
  },
  async deleteTask(id) {
    const t = findTask(id); if (!t) return null;
    await commit({del: {tasks: [id]}, touchDays: [t.dayId]}); return t;
  },
  async restoreTask(t) { await commit({put: {tasks: [t]}}); },
  targetDay(t, n) {
    const day = index().dayById.get(t.dayId), days = index().daysByRoutine.get(day.routineId) || [];
    if (!Number.isInteger(n) || n < 1) return {error: 'Enter a day number.'};
    const target = days.find(d => d.dayNumber === n);
    return target ? {target} : {error: `Day ${n} doesn't exist. This routine has ${days.length} days.`};
  },
  async moveTask(id, n) {
    const t = findTask(id); if (!t) return {error: 'That task no longer exists.'};
    const r = this.targetDay(t, n); if (r.error) return r;
    if (r.target.id === t.dayId) return {error: 'The task is already on that day.'};
    await commit({put: {tasks: [{...t, dayId: r.target.id, sortOrder: nextOrder(r.target.id), updatedAt: Date.now()}]}, touchDays: [t.dayId]});
    return {day: r.target};
  },
  async copyTask(id, n) {
    const t = findTask(id); if (!t) return {error: 'That task no longer exists.'};
    const r = this.targetDay(t, n); if (r.error) return r;
    await commit({put: {tasks: [newTask(r.target.id, t.subjectId, t.title, nextOrder(r.target.id), {minutes: t.estimatedMinutes, note: t.note})]}});
    return {day: r.target};
  },
  async clearAll() {
    await commit({del: {routines: S.routines.map(x => x.id), days: S.days.map(x => x.id), tasks: S.tasks.map(x => x.id), subjects: S.subjects.map(x => x.id)}});
    ui.viewRoutineId = null; ui.dayOpen = {};
  }
};

/* ---- bottom sheet ---- */
let sheetEl = null, sheetOpener = null, confirmCb = null;

/* ---- HOME ---- */
function viewHome() {
  const r = primaryRoutine();
  if (!r) return storageNotice() + emptyRoutine();
  const ti = todayInfo(r), h = new Date().getHours();
  const greet = (h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening') + (S.settings.name ? ', ' + esc(S.settings.name) : '');
  const title = ti.state === 'during' ? `Day ${ti.n} of ${r.duration}` : ti.state === 'before' ? 'Starting soon' : 'Routine finished';
  let out = `${storageNotice()}<header class="page-head"><button class="icon-btn head-search" data-a="search" aria-label="Search">${icon('search')}</button><p class="greet">${greet}</p><h1 class="title">${title}</h1>
    <p class="sub">${fmtLong(todayISO())}</p><p class="sub">${esc(r.name)}</p></header>`;
  if (ti.state !== 'during') {
    const st = statsFor(r);
    const msg = ti.state === 'before'
      ? `This routine starts on ${fmtShort(r.startDate)}, in ${-ti.n + 1} day${-ti.n + 1 === 1 ? '' : 's'}.`
      : `This routine ended on ${fmtShort(addDaysISO(r.startDate, r.duration - 1))}. You finished ${st.done} of ${st.total} tasks.`;
    return out + `<section class="card prog"><p class="prog-text">${msg}</p></section>
      <div class="quick"><button class="chip-btn primary" data-a="go-routine">Open routine</button></div>`;
  }
  const ts = index().tasksByDay.get(ti.day.id) || [], open = ts.filter(t => !t.completed), done = ts.filter(t => t.completed);
  const pct = ts.length ? Math.round(done.length / ts.length * 100) : 0;
  out += `<section class="card prog" aria-label="Today's progress"><div class="prog-row"><span class="pct">${pct}%</span>
    <span class="prog-text">${ts.length ? `${done.length} of ${ts.length} tasks done` : 'Nothing planned for today'}</span></div>
    <div class="bar${pct === 100 ? ' full' : ''}" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><span data-to="${pct}" style="width:${ui.lastPct}%"></span></div></section>
    ${continueCard()}<div class="quick">
      <button class="chip-btn primary" data-a="add-task-today">${icon('plus', 18)} Add task</button>
      <button class="chip-btn" data-a="focus">${icon('play', 16)} Start focus</button>
      <button class="chip-btn" data-a="go-ai">${icon('ai', 16)} Ask AI</button></div>`;
  if (ts.length && !open.length) out += `<p class="muted" style="margin:var(--s4) 0">Everything for today is done.</p>`;
  if (open.length) out += `<div class="card list-card" style="margin-top:var(--s3)">${groupBySubject(open).map(g => `<div class="subj"><h3 class="subj-name">${esc(g.name)}</h3>${g.tasks.map(taskRow).join('')}</div>`).join('')}</div>`;
  if (!ts.length) out += `<p class="muted" style="margin:var(--s4) 0">Add a task to get today started.</p>`;
  if (done.length) {
    out += `<button class="completed-head" data-a="toggle-completed" aria-expanded="${ui.showCompleted}">Completed (${done.length}) ${icon('chev', 16)}</button>`;
    if (ui.showCompleted) out += `<div class="card list-card">${groupBySubject(done).map(g => `<div class="subj"><h3 class="subj-name">${esc(g.name)}</h3>${g.tasks.map(taskRow).join('')}</div>`).join('')}</div>`;
  }
  return out;
}

/* ---- ROUTINE ---- */
function dayCard(d, ti) {
  const ts = index().tasksByDay.get(d.id) || [], done = ts.filter(t => t.completed).length, complete = d.status === 'complete';
  const isToday = ti.state === 'during' && d.dayNumber === ti.n;
  const isOpen = ui.pendingCollapse.has(d.id) ? true : (d.id in ui.dayOpen ? ui.dayOpen[d.id] : !complete);
  const body = groupBySubject(ts).map(g => `<div class="subj"><h3 class="subj-name">${esc(g.name)}</h3>${g.tasks.map(taskRow).join('')}</div>`).join('') || `<p class="empty-day">No tasks yet</p>`;
  return `<div class="dayw${complete ? ' is-complete' : ''}${isToday ? ' is-today' : ''}" id="dw-${d.dayNumber}"><span class="node"></span>
    <article class="day${isOpen ? ' open' : ''}${isToday ? ' today' : ''}${complete ? ' complete' : ''}" data-day="${d.id}">
      <button class="day-head" data-a="day-toggle" data-id="${d.id}" aria-expanded="${isOpen}">
        <span class="day-title">Day ${d.dayNumber}</span><span class="day-date">${fmtShort(d.date)}</span>${isToday ? '<span class="tag">Today</span>' : ''}
        <span class="day-prog">${complete ? icon('check', 16) + '<span class="sr">Complete</span>' : ''}${ts.length ? `${done}/${ts.length}` : 'Empty'}</span><span class="chev">${icon('chev', 18)}</span></button>
      <div class="day-body"><div class="day-clip"><div class="day-content">${body}
        <div class="day-foot"><button class="add-inline" data-a="add-task" data-day="${d.id}">${icon('plus', 16)} Add task</button><button class="add-inline" data-a="ask-ai-day" data-id="${d.id}" aria-label="Ask AI about Day ${d.dayNumber}">${icon('ai', 16)} Ask AI</button></div></div></div></div>
    </article></div>`;
}
function viewRoutine() {
  const r = currentRoutine(); if (!r) return emptyRoutine();
  const ix = index(), days = ix.daysByRoutine.get(r.id) || [], ti = todayInfo(r);
  let list;
  if (ui.routineView === 'today') {

/* ---- PROGRESS ---- */
function viewProgress() {
  const r = primaryRoutine();
  if (!r) return `<header class="page-head"><h1 class="title">Progress</h1></header>` + emptyRoutine();
  const st = statsFor(r), ti = todayInfo(r), ix = index(), streak = streakFor(r);
  const pos = ti.state === 'during' ? `Day ${ti.n} of ${r.duration}` : ti.state === 'before' ? `Starts ${fmtShort(r.startDate)}` : 'Finished';
  const subs = [...st.bySubj].map(([id, b]) => ({name: (ix.subjectById.get(id) || {}).name || 'Other', ...b, pct: Math.round(b.done / b.total * 100)})).sort((a, b) => b.total - a.total);
  const miles = [7, 14, 30, 60, 90], next = miles.find(m => m > streak);
  return `<header class="page-head"><h1 class="title">Progress</h1><p class="sub">${esc(r.name)}</p></header>
    <section class="card prog"><div class="prog-row"><span class="pct">${st.pct}%</span><span class="prog-text">of tasks complete</span></div>
      <div class="bar${st.pct === 100 ? ' full' : ''}" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${st.pct}"><span style="width:${st.pct}%"></span></div></section>
    <div class="card stat-list" style="margin-top:var(--s3)">
      <div class="stat"><span>Position</span><b>${pos}</b></div>
      <div class="stat"><span>Days completed</span><b>${st.daysDone} of ${st.days}</b></div>
      <div class="stat"><span>Tasks completed</span><b>${st.done} of ${st.total}</b></div></div>
    ${subs.length ? `<h2 class="h2">Subjects</h2><div class="card stat-list">${subs.map(s => `<div class="subj-row"><div class="top"><span>${esc(s.name)}</span><b>${s.pct}%</b></div>
      <div class="bar${s.pct === 100 ? ' full' : ''}"><span style="width:${s.pct}%"></span></div><small>${s.done} of ${s.total} tasks</small></div>`).join('')}</div>` : ''}
    ${studyHTML(r)}
    <h2 class="h2">Streak</h2><div class="card streak">${icon('flame', 28)}<div>
      ${streak ? `<b>${streak} day streak</b>` : '<b>No streak yet</b>'}
      <p class="muted">${streak ? '' : 'Finish every task in a day to start one.'}</p>
      <div class="miles">${miles.map(m => `<span class="mile${streak >= m ? ' hit' : ''}">${m}</span>`).join('')}</div>
      ${next && streak ? `<p class="muted" style="margin-top:var(--s2)">${next - streak} more to reach ${next}.</p>` : ''}</div></div>`;
}

/* ---- render pipeline ---- */
const VIEWS = {home: viewHome, routine: viewRoutine, ai: () => viewAI(), progress: viewProgress, more: viewMore};
const NAV = [['home', 'Home', 'home'], ['routine', 'Routine', 'route'], ['ai', 'AI', 'ai'], ['progress', 'Progress', 'progress'], ['more', 'More', 'more']];
let todayIO = null;
function render() {
  $('#view').innerHTML = VIEWS[ui.tab]();
  document.querySelectorAll('#nav button').forEach(b => { if (b.dataset.tab === ui.tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  afterRender();
}
function afterRender() {
  if (ui.tab === 'home') {
    const b = $('.bar span[data-to]');
    if (b) requestAnimationFrame(() => requestAnimationFrame(() => { b.style.width = b.dataset.to + '%'; ui.lastPct = +b.dataset.to; }));
  }
  if (ui.pendingCollapse.size) {
    const ids = [...ui.pendingCollapse]; ui.pendingCollapse.clear();
    requestAnimationFrame(() => requestAnimationFrame(() => ids.forEach(id => {
      const c = document.querySelector(`.day[data-day="${id}"]`);
      if (c) { c.classList.remove('open'); const h = $('.day-head', c); if (h) h.setAttribute('aria-expanded', 'false'); }
    })));
  }
  if (todayIO) { todayIO.disconnect(); todayIO = null; }
  if (ui.tab === 'routine') {
    const pill = $('.fab-today'), target = $('.dayw.is-today');
    if (pill && target && 'IntersectionObserver' in window) {
      todayIO = new IntersectionObserver(es => pill.classList.toggle('show', !es[0].isIntersecting));
      todayIO.observe(target);
    }
    if (ui.scrollToday) {
      ui.scrollToday = false;
      const r = currentRoutine(), ti = r && todayInfo(r);
      if (ui.routineView === 'all' && r) scrollToDay(ti.state === 'during' ? ti.n : 1, {instant: true, quiet: true});
    }
  }
}
function scrollToDay(n, o) {
  o = o || {}; const el = document.getElementById('dw-' + n); if (!el) return;
  const smooth = !o.instant && !reduceMotion();
  el.scrollIntoView({block: 'start', behavior: smooth ? 'smooth' : 'auto'});
  setTimeout(() => { if (Math.abs(el.getBoundingClientRect().top - (parseFloat(getComputedStyle(el).scrollMarginTop) || 0)) > 40) el.scrollIntoView({block: 'start'}); }, smooth ? 700 : 60);
  if (!o.quiet) { el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
}
function setTab(t) {
  ui.tab = t; window.scrollTo(0, 0);
  if (t === 'routine') ui.scrollToday = true;
  render();
}

/* ------------------------- rich text sanitizer ------------------------- */
const NOTE_TAGS = new Set(['P', 'BR', 'DIV', 'H2', 'H3', 'B', 'STRONG', 'I', 'EM', 'U', 'UL', 'OL', 'LI']);

/* ------------------------------- search ------------------------------- */

    ai.messages.push(aiMsg('ai', (res.text || '').trim() || (cards.length ? 'Here is what I prepared.' : '…'), {cards}));

const md = t => { const lines = esc(t).split(/\n/); let out = '', list = false; lines.forEach(l => { const b = l.match(/^\s*[-*•]\s+(.*)$/); const f = s => s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); if (b) { if (!list) { out += '<ul>'; list = true; } out += `<li>${f(b[1])}</li>`; } else { if (list) { out += '</ul>'; list = false; } if (l.trim()) out += `<p>${f(l)}</p>`; } }); return out + (list ? '</ul>' : ''); };

  'ai-apply': async el => {
    const c = ai.cards.get(el.dataset.id); if (!c || c.status !== 'pending') return;
    try { const rec = await applyPlan(c.plan, c.summary); c.status = 'applied'; c.changeId = rec.id; toast('Changes applied.', {label: 'Undo', ms: 6000, onAction: async () => { await undoAIChange(rec.id); c.status = 'undone'; render(); toast('Changes undone.'); }}); }
    catch (e) { c.status = 'failed'; c.error = (e && e.message) || 'Those changes could not be applied.'; }
    render();
  },
  'ai-undo': async el => { const c = ai.cards.get(el.dataset.id); if (!c || !c.changeId) return; await undoAIChange(c.changeId); c.status = 'undone'; render(); toast('Changes undone.'); },
  'ai-undo-rec': async el => { const id = el.dataset.id; closeSheet(); await undoAIChange(id); ai.cards.forEach(c => { if (c.changeId === id) c.status = 'undone'; }); render(); toast('Changes undone.'); }
});
Object.assign(FORMS, {
  async 'focus-start'(f) {
    const mode = f.elements.mode.value; let minutes = 0;
    if (mode === 'pomodoro') { minutes = toInt(f.elements.min.value); if (!(minutes >= 1 && minutes <= 600)) return showErr(f, 'Enter minutes from 1 to 600.'); }
    saveActive({id: uid(), taskId: f.elements.task.value || null, mode, targetSec: minutes * 60, startedAt: Date.now(), elapsedBefore: 0, runningSince: Date.now()});
    fx.notified = null; openFocus(); render();
  },
  async 'tpl-use'(f) {
    const t = S.templates.find(x => x.id === f.dataset.id); if (!t) return; const items = new Map();
    t.data.days.forEach(d => items.set(d.dayNumber, d.items.map(i => ({subject: i.subject, title: i.title, minutes: i.minutes, note: i.note}))));
    const res = await cmd.createRoutine({name: f.elements.name.value, startDate: f.elements.startDate.value, duration: t.data.duration, items, makePrimary: f.elements.primary ? f.elements.primary.checked : true});
    if (res.error) return showErr(f, res.error); closeSheet(); ui.viewRoutineId = res.id; setTab('routine'); toast('Routine created from template.');
  },
  'import-check'(f) {
    const txt = f.elements.text.value.trim(); if (!txt) return showErr(f, 'Choose a file or paste the backup text.');
    const v = validateBackup(txt); if (v.error) { $('#imp-prev', f).innerHTML = ''; return showErr(f, v.error); }
    importState = v; const e = $('.err', f); e.hidden = true; $('#imp-prev', f).innerHTML = importPreviewHTML(v.clean, v.dropped);
  },
  'ai-send'(f) {
    const text = f.elements.q.value.trim(); if (!text || ai.busy) return;
    ui.aiDraft = ''; ai.messages.push(aiMsg('user', text + ((ui.aiFiles || []).length ? `\n\n[Attached: ${ui.aiFiles.map(x => x.name).join(', ')}]` : ''))); aiRun();
  },
  'ai-settings'(f) {
    setSetting('aiProvider', f.elements.provider.value);
    setSetting('geminiKey', f.elements.geminiKey.value.trim()); setSetting('geminiModel', clean(f.elements.geminiModel.value, 60) || 'gemini-3.8-flash');
    Object.entries(PROVIDER_DEFS).forEach(([id, d]) => { setSetting(d.keyField, f.elements[d.keyField].value.trim()); setSetting(d.modelField, clean(f.elements[d.modelField].value, 80) || d.defaultModel); });
    setSetting('aiAutoApply', !!(f.elements.autoApply && f.elements.autoApply.checked));
    setSetting('aiMode', f.elements.aiMode ? f.elements.aiMode.value : 'chat'); setSetting('agentKey', f.elements.agentKey ? f.elements.agentKey.value.trim() : ''); setSetting('agentUrl', f.elements.agentUrl ? f.elements.agentUrl.value.trim() : ''); setSetting('aiMemory', !!(f.elements.memory && f.elements.memory.checked)); setSetting('aiFileTools', !!(f.elements.fileTools && f.elements.fileTools.checked));
    closeSheet(); render(); toast('AI settings saved.');
  },
  async 'ai-draft'(f) {
    const c = ai.cards.get(f.dataset.id); if (!c) return; const d = c.draft;
    const res = await cmd.createRoutine({name: f.elements.name.value, startDate: f.elements.startDate.value, duration: d.duration, items: d.items, makePrimary: f.elements.primary.checked});
    if (res.error) return showErr(f, res.error);
    const rec = {id: uid(), description: `Created routine “${clean(f.elements.name.value, 60)}”`, previousState: {tasks: []}, newState: {createdRoutineId: res.id}, createdAt: Date.now(), revertedAt: null};
    await commit({put: {aiChanges: [rec]}}); c.status = 'created'; c.changeId = rec.id; ui.viewRoutineId = res.id; render(); toast('Routine created.');
  },
  async 'ai-rev'(f) {
    const c = ai.cards.get(f.dataset.id), t = c && findTask(c.rev.taskId); if (!t) return showErr(f, 'That task no longer exists.');
    const offs = [...new Set(f.elements.offsets.value.split(/[,\s،]+/).filter(Boolean).map(toInt))];
    if (!offs.length || offs.some(o => !(o >= 1 && o <= 365)) || offs.length > 6) return showErr(f, 'Enter up to 6 whole numbers between 1 and 365.');
    const day = index().dayById.get(t.dayId), r = S.routines.find(x => x.id === day.routineId), sim = makeSim(r); let skipped = 0;
    offs.sort((a, b) => a - b).forEach(o => { const n = day.dayNumber + o; if (n > r.duration) skipped++; else EXEC.createTask(sim, {dayNumber: n, subject: subjName(t), title: 'Revision: ' + t.title}); });
    const plan = buildPlan(sim); if (!plan.has) return showErr(f, 'Those days are beyond the end of this routine.');
    try { const rec = await applyPlan(plan, `Revision for “${t.title}”`); c.status = 'accepted'; c.changeId = rec.id; render(); toast(skipped ? `Added revision. ${skipped} date(s) fell past the routine's end.` : 'Revision added to your plan.'); }
    catch (e) { showErr(f, e.message); }
  }
});
document.addEventListener('change', e => { if (e.target && e.target.id === 'ai-file-input') { ui.aiFiles = Array.from(e.target.files || []).slice(0,8).map(f => ({name:f.name, type:f.type, size:f.size})); render(); } });
document.addEventListener('input', e => {
  if (e.target.matches('.composer textarea')) { ui.aiDraft = e.target.value; e.target.style.height = 'auto'; e.target.style.height = Math.min(140, e.target.scrollHeight) + 'px'; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && e.target.matches('.composer textarea') && matchMedia('(pointer:fine)').matches) { e.preventDefault(); const f = e.target.closest('form'); FORMS['ai-send'](f); }
  if (e.key === 'Escape' && !sheetEl && pageEl) { if ($('#ed', pageEl)) H['note-back'](); else closePage(); }
});

/* wrap clearAll so notes/sessions/templates/AI history and the timer go too */
const _clearAll = cmd.clearAll;
cmd.clearAll = async function () {
  await commit({del: {notes: S.notes.map(x => x.id), sessions: S.sessions.map(x => x.id), templates: S.templates.map(x => x.id), aiChanges: S.aiChanges.map(x => x.id)}});
  saveActive(null); ai.messages = []; ai.cards.clear(); await _clearAll.call(cmd);
};

/* keep the AI view scrolled to the newest message after a render */
const _afterRender = afterRender;
afterRender = function () { _afterRender(); if (ui.tab === 'ai' && ai.scroll) { ai.scroll = false; requestAnimationFrame(() => window.scrollTo({top: document.body.scrollHeight})); } };

/* capabilities offered by the claude.ai viewer (absent elsewhere) */
(function detectCaps() {
  if (!window.claude || typeof window.claude.use !== 'function') return;
  window.claude.use('sample').then(s => { if (s) { ai.sample = s; if (ui.tab === 'ai') render(); } }).catch(() => {});
  window.claude.use('downloads').then(d => { if (d) dl = d; }).catch(() => {});
})();

window.__inflowmap = {S, ui, cmd, ai, aiProviders, EXEC, parseBulk, validateBackup, planImport, searchAll, sanitizeHTML, index, todayInfo, statsFor, streakFor, db};
boot();
</script>

    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
